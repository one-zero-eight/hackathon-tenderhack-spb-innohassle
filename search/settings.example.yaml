# yaml-language-server: $schema=settings.schema.yaml
$schema: "./settings.schema.yaml"

# CloakBrowser (ya.ru) — SOCKS5 only. Export yandex_cookies.json from the same proxy.
yandex_search_settings:
  headless: true
  humanize: false
  geoip: true
  proxy: null
  # user:pass@host:port or socks5://user:pass@host:port
  proxies:
    - "user:pass@127.0.0.1:1080"
