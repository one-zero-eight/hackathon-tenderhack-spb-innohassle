services:
    frontend:
        restart: always
        build:
            context: frontend
            dockerfile: Dockerfile
        ports:
            - "127.0.0.1:9010:8080"

    api:
        build:
            context: ./backend
            dockerfile: Dockerfile
        depends_on:
            postgres:
                condition: service_healthy
        restart: always
        ports:
            - "127.0.0.1:9011:8000"
        volumes:
            - type: bind
              source: ./backend/settings.yaml
              target: /app/settings.yaml
              bind:
                  create_host_path: false

    postgres:
        image: "postgres:17.1"
        restart: always
        volumes:
            - "postgres:/var/lib/postgresql/data"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

volumes:
    caddy_data:
    postgres:
