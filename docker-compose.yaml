services:
    caddy:
        image: caddy:latest
        container_name: caddy-server
        restart: unless-stopped
        ports:
            - "${CADDY_PORT:-9443}:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile
            - caddy_data:/data
        networks:
            - app_network
        depends_on:
            - frontend
            - api

    frontend:
        build:
            context: frontend
            dockerfile: Dockerfile.dev
        ports:
            - "127.0.0.1:8080:8080"
        volumes:
            - ./frontend:/app
            - /app/node_modules
        environment:
            - VITE_DEV_SERVER_HOST=0.0.0.0
            - VITE_DEV_PROXY_TARGET=http://api:8000
        networks:
            - app_network

    api:
        build:
            context: ./backend
            dockerfile: Dockerfile
        depends_on:
            postgres:
                condition: service_healthy
        restart: always
        ports:
            - "127.0.0.1:8000:8000"
        networks:
            - app_network
        configs:
            - source: backend_settings
              target: /app/settings.yaml

    postgres:
        image: "postgres:17.1"
        restart: always
        volumes:
            - "postgres:/var/lib/postgresql/data"
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
        networks:
            - app_network

    ollama:
        image: ollama/ollama:latest
        restart: always
        ports:
            - "11434:11434"
        volumes:
            - ollama:/root/.ollama
        networks:
            - app_network

volumes:
    caddy_data:
    postgres:
    ollama:

networks:
    app_network:

configs:
    backend_settings:
        content: |
            $$schema: "./settings.schema.yaml"
            api_settings:
                app_root_path: "/api"
                db_url: "postgresql+asyncpg://postgres:postgres@postgres:5432/postgres"
                secret_key: ${SECRET_KEY:-meow}
                token_expiration_in_minutes: 60

            ollama_settings:
                host: "http://ollama:11434"
                model: "granite4.1:8b"
                batch_size: 5

            auth_settings:
                access_token_ttl_minutes: 60
                refresh_token_ttl_days: 7
