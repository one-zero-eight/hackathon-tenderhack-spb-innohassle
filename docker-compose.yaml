services:
    caddy:
        image: caddy:latest
        container_name: caddy-server
        restart: unless-stopped
        ports:
            - "${CADDY_PORT:-9443}:443"
        volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile
            - caddy_data:/data
        networks:
            - app_network
        depends_on:
            - frontend
            - api

    frontend:
        build:
            context: frontend
            dockerfile: Dockerfile
        ports:
            - "127.0.0.1:8080:8080"
        volumes:
            - .:/app
            - /app/node_modules
        environment:
            - VITE_DEV_SERVER_HOST=0.0.0.0
        networks:
            - app_network

    api:
        build:
            context: ./backend
            dockerfile: Dockerfile
        depends_on:
            db:
                condition: service_healthy
        restart: always
        ports:
            - "127.0.0.1:8000:8000"
        volumes:
            - type: bind
              source: ./backend/settings.yaml
              target: /app/settings.yaml
              bind:
                  create_host_path: false
        networks:
            - app_network

    db:
        image: "postgres:17.1"
        restart: always
        volumes:
            - "postgres:/var/lib/postgresql/data"
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
        networks:
            - app_network

volumes:
    caddy_data:
    postgres:

networks:
    app_network:
