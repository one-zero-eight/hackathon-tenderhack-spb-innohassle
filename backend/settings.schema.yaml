$schema: https://json-schema.org/draft-07/schema
$defs:
  ApiSettings:
    properties:
      app_root_path:
        default: /api
        title: App Root Path
        type: string
      cors_allow_origin_regex:
        default: .*
        title: Cors Allow Origin Regex
        type: string
      db_url:
        examples:
        - postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
        - postgresql+asyncpg://postgres:postgres@db:5432/postgres
        format: password
        title: Db Url
        type: string
        writeOnly: true
      secret_key:
        format: password
        title: Secret Key
        type: string
        writeOnly: true
      nominatim_url:
        default: http://nominatim:8080
        examples:
        - http://nominatim:8080
        - http://localhost:8080
        title: Nominatim Url
        type: string
    required:
    - db_url
    - secret_key
    title: ApiSettings
    type: object
  AuthSettings:
    properties:
      encryption_algorithm:
        default: HS256
        title: Encryption Algorithm
        type: string
      access_token_ttl_minutes:
        default: 60
        title: Access Token Ttl Minutes
        type: integer
      refresh_token_ttl_days:
        default: 7
        title: Refresh Token Ttl Days
        type: integer
      leeway:
        default: 60
        title: Leeway
        type: integer
    title: AuthSettings
    type: object
  OzonSettings:
    properties:
      headless:
        default: true
        title: Headless
        type: boolean
      slow:
        default: false
        title: Slow
        type: boolean
      proxy:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Proxy
      proxies:
        items:
          type: string
        title: Proxies
        type: array
      page_load_timeout:
        default: 180
        title: Page Load Timeout
        type: integer
      element_wait_timeout:
        default: 45
        title: Element Wait Timeout
        type: integer
      page_load_retries:
        default: 4
        title: Page Load Retries
        type: integer
    title: OzonSettings
    type: object
properties:
  api_settings:
    $ref: '#/$defs/ApiSettings'
  auth_settings:
    $ref: '#/$defs/AuthSettings'
  ozon_settings:
    $ref: '#/$defs/OzonSettings'
required:
- api_settings
- auth_settings
title: Settings
type: object
