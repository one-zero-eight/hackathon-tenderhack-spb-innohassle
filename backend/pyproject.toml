[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16.5",
    "asyncpg>=0.30.0",
    "bcrypt>=4.3.0",
    "colorlog>=6.9.0",
    "fake-useragent>=2.0.3",
    "fastapi>=0.116.1",
    "fastapi-derive-responses>=0.1.4",
    "fastapi-swagger>=0.3.29",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "libcst>=1.8.4",
    "passlib>=1.7.4",
    "playwright>=1.60.0",
    "pydantic[email]>=2.11.7",
    "python-jose>=3.5.0",
    "python-multipart>=0.0.20",
    "pyvirtualdisplay>=3.0",
    "pyyaml>=6.0.2",
    "requests>=2.34.2",
    "ruff>=0.12.11",
    "selenium>=4.25.0",
    "selenium-stealth>=1.0.6",
    "setuptools>=82.0.1",
    "sqlalchemy>=2.0.43",
    "typer>=0.17.4",
    "undetected-chromedriver>=3.5.5",
    "uvicorn>=0.35.0",
    "webdriver-manager>=4.0.2",
]

[tool.ruff]
line-length = 120
lint.ignore = [
    # wildcard imports are fine
    "F403",
    "F405",
    "PLR"
]
lint.extend-select = ["I", "UP", "PL"]
exclude = [
    ".git",
    ".venv",
    "venv",
    "alembic",
]
