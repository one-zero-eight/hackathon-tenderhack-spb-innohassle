name: Migrate databases locally

on:
    workflow_dispatch:

jobs:
    migrate:
        runs-on: deploy

        steps:
            - name: Restart stack and run migrations
              run: |
                  set -eu
                  cd /srv/apps/tenderhack-spb
                  docker compose -f prod-compose.yaml --env-file .env down -v
                  docker compose -f prod-compose.yaml --env-file .env up --build -d
