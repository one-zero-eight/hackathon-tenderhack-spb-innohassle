services:
    frontend:
        restart: always
        build:
            context: frontend
            dockerfile: Dockerfile
        ports:
            - "127.0.0.1:9010:8080"

    api:
        build:
            context: ./backend
            dockerfile: Dockerfile
        depends_on:
            postgres:
                condition: service_healthy
        restart: always
        ports:
            - "127.0.0.1:9011:8000"
        configs:
            - source: backend_settings
              target: /app/settings.yaml

    postgres:
        image: "postgres:17.1"
        restart: always
        volumes:
            - "postgres:/var/lib/postgresql/data"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

volumes:
    caddy_data:
    postgres:


configs:
    backend_settings:
        content: |
            $$schema: "./settings.schema.yaml"
            api_settings:
                db_url: "postgresql+asyncpg://postgres:postgres@postgres:5432/postgres"
                secret_key: ${SECRET_KEY:-meow}
                token_expiration_in_minutes: 60

            auth_settings:
                access_token_ttl_minutes: 60
                refresh_token_ttl_days: 7
