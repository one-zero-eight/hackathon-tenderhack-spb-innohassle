# yaml-language-server: $schema=settings.schema.yaml
$schema: "./settings.schema.yaml"
api_settings:
  db_url: "postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/postgres"
  secret_key: ...  # use `openssl rand -hex 32` to generate a random key
  token_expiration_in_minutes: 60

auth_settings:
  access_token_ttl_minutes: 60
  refresh_token_ttl_days: 7

ozon_settings:
  headless: true
  slow: false
  proxy: null
  proxies: []
  page_load_timeout: 180
  element_wait_timeout: 45
  page_load_retries: 4
  fetch_details: false
  cookies_file: cookies.json

wildberries_settings:
  headless: true
  chrome_executable_path: null
  page_load_timeout: 60
  element_wait_timeout: 45
  page_load_retries: 3

browser_pool_settings:
  wildberries_pool_size: 2
  ozon_pool_size: 2

yandex_market_settings:
  proxy: null
  proxies: []
  warmup: true
  timeout: 30
  request_retries: 3
