services:
  search:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8001:8000"
    env_file:
      - .env
    environment:
      CLOAK_HEADLESS: "true"
      SETTINGS_PATH: /app/settings.yaml
    volumes:
      - ./yandex_cookies.json:/app/yandex_cookies.json:ro
      - ./settings.yaml:/app/settings.yaml:ro
