$schema: https://json-schema.org/draft-07/schema
title: SearchSettings
type: object
additionalProperties: false
properties:
  yandex_search_settings:
    type: object
    additionalProperties: false
    properties:
      headless:
        type: boolean
      humanize:
        type: boolean
      geoip:
        type: boolean
      proxy:
        type: string
        nullable: true
        description: Single SOCKS5 proxy (user:pass@host:port or socks5://...)
      proxies:
        type: array
        items:
          type: string
        description: SOCKS5 proxy pool for Playwright ya.ru search
    default: {}
