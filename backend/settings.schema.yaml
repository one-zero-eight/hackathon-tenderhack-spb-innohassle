$schema: https://json-schema.org/draft-07/schema
$defs:
  ApiSettings:
    properties:
      app_root_path:
        default: /api
        title: App Root Path
        type: string
      cors_allow_origin_regex:
        default: .*
        title: Cors Allow Origin Regex
        type: string
      db_url:
        examples:
        - postgresql+asyncpg://postgres:postgres@localhost:5432/postgres
        - postgresql+asyncpg://postgres:postgres@db:5432/postgres
        format: password
        title: Db Url
        type: string
        writeOnly: true
      secret_key:
        format: password
        title: Secret Key
        type: string
        writeOnly: true
    required:
    - db_url
    - secret_key
    title: ApiSettings
    type: object
  AuthSettings:
    properties:
      encryption_algorithm:
        default: HS256
        title: Encryption Algorithm
        type: string
      access_token_ttl_minutes:
        default: 60
        title: Access Token Ttl Minutes
        type: integer
      refresh_token_ttl_days:
        default: 7
        title: Refresh Token Ttl Days
        type: integer
      leeway:
        default: 60
        title: Leeway
        type: integer
    title: AuthSettings
    type: object
  BrowserPoolSettings:
    properties:
      wildberries_pool_size:
        default: 2
        maximum: 5
        minimum: 1
        title: Wildberries Pool Size
        type: integer
      ozon_pool_size:
        default: 2
        maximum: 5
        minimum: 1
        title: Ozon Pool Size
        type: integer
    title: BrowserPoolSettings
    type: object
  OllamaSettings:
    properties:
      host:
        default: http://ollama:11434
        examples:
        - http://ollama:11434
        - http://localhost:11434
        title: Host
        type: string
      model:
        default: granite4.1:8b
        title: Model
        type: string
      batch_size:
        default: 5
        maximum: 20
        minimum: 1
        title: Batch Size
        type: integer
      timeout:
        default: 60
        title: Timeout
        type: integer
    title: OllamaSettings
    type: object
  OzonSettings:
    properties:
      headless:
        default: true
        title: Headless
        type: boolean
      geoip:
        default: true
        title: Geoip
        type: boolean
      humanize:
        default: false
        title: Humanize
        type: boolean
      slow:
        default: false
        title: Slow
        type: boolean
      proxy:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Proxy
      proxies:
        items:
          type: string
        title: Proxies
        type: array
      page_load_timeout:
        default: 20
        title: Page Load Timeout
        type: integer
      element_wait_timeout:
        default: 8
        title: Element Wait Timeout
        type: integer
      page_load_retries:
        default: 1
        title: Page Load Retries
        type: integer
      fetch_details:
        default: false
        title: Fetch Details
        type: boolean
      composer_search:
        default: true
        title: Composer Search
        type: boolean
      composer_raw:
        default: true
        title: Composer Raw
        type: boolean
      cookies_file:
        anyOf:
        - type: string
        - type: 'null'
        default: cookies.json
        title: Cookies File
    title: OzonSettings
    type: object
  WildberriesSettings:
    properties:
      headless:
        default: true
        title: Headless
        type: boolean
      chrome_executable_path:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Chrome Executable Path
      proxy:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Proxy
      proxies:
        items:
          type: string
        title: Proxies
        type: array
      page_load_timeout:
        default: 20
        title: Page Load Timeout
        type: integer
      element_wait_timeout:
        default: 8
        title: Element Wait Timeout
        type: integer
      page_load_retries:
        default: 1
        title: Page Load Retries
        type: integer
      geoip:
        default: true
        title: Geoip
        type: boolean
      humanize:
        default: false
        title: Humanize
        type: boolean
      search_api:
        default: true
        title: Search Api
        type: boolean
      search_api_raw:
        default: true
        title: Search Api Raw
        type: boolean
    title: WildberriesSettings
    type: object
  YandexMarketSettings:
    properties:
      proxy:
        anyOf:
        - type: string
        - type: 'null'
        default: null
        title: Proxy
      proxies:
        items:
          type: string
        title: Proxies
        type: array
      timeout:
        default: 30
        title: Timeout
        type: integer
      connect_timeout:
        default: 6
        title: Connect Timeout
        type: integer
      request_retries:
        default: 3
        maximum: 6
        minimum: 1
        title: Request Retries
        type: integer
      warmup:
        default: true
        title: Warmup
        type: boolean
    title: YandexMarketSettings
    type: object
properties:
  api_settings:
    $ref: '#/$defs/ApiSettings'
  auth_settings:
    $ref: '#/$defs/AuthSettings'
  ozon_settings:
    $ref: '#/$defs/OzonSettings'
  wildberries_settings:
    $ref: '#/$defs/WildberriesSettings'
  browser_pool_settings:
    $ref: '#/$defs/BrowserPoolSettings'
  yandex_market_settings:
    $ref: '#/$defs/YandexMarketSettings'
  ollama_settings:
    $ref: '#/$defs/OllamaSettings'
required:
- api_settings
- auth_settings
title: Settings
type: object
